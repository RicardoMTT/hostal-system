name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "startup.sh"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y deploy de la API

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar packages/shared
        run: npm --workspace packages/shared run build

      - name: Generar Prisma Client
        run: npm --workspace apps/api run db:generate

      - name: Compilar API
        run: npm --workspace apps/api run build

      - name: Verificar build
        run: |
          echo "=== Contenido de apps/api/dist ==="
          ls -la apps/api/dist || echo "ERROR: dist no existe"
          echo "=== server.js existe? ==="
          ls -la apps/api/dist/server.js || echo "ERROR: server.js no encontrado"

      - name: Ejecutar migraciones de base de datos
        run: npm --workspace apps/api run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Preparar artefacto de deploy
        run: |
          mkdir -p deploy_artifact/apps/api
          mkdir -p deploy_artifact/packages/shared

          # Raiz
          cp package.json deploy_artifact/
          cp startup.sh deploy_artifact/
          chmod +x deploy_artifact/startup.sh

          # API: dist + prisma + package.json
          cp -r apps/api/dist deploy_artifact/apps/api/dist
          cp -r apps/api/prisma deploy_artifact/apps/api/prisma
          cp apps/api/package.json deploy_artifact/apps/api/package.json

          # Shared compilado
          cp -r packages/shared/dist deploy_artifact/packages/shared/dist
          cp packages/shared/package.json deploy_artifact/packages/shared/package.json

          # node_modules completo (incluye .prisma/client)
          cp -r node_modules deploy_artifact/node_modules

          echo "=== Verificando artefacto ==="
          ls -la deploy_artifact/
          ls -la deploy_artifact/apps/api/dist/
          ls -la deploy_artifact/node_modules/.prisma/client/ | head -5

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "hostal-os-pms-api"
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: "./deploy_artifact"
